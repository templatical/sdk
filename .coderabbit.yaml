# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit reads this file from the pull request's head branch, so a PR that
# changes it is reviewed under the new settings.
#
# The path instructions restate the repository rules a reviewer can check from a
# diff. The maintainers' full agent instructions are not committed, so a rule
# that changes there changes here in the same PR.

language: en-US

reviews:
  profile: chill

  # The summary goes in the walkthrough comment; PR descriptions stay as written.
  high_level_summary: true
  high_level_summary_in_walkthrough: true

  sequence_diagrams: false
  estimate_code_review_effort: false
  suggested_reviewers: false
  in_progress_fortune: false
  poem: false

  auto_review:
    enabled: true
    drafts: false
    # Renovate opens most PRs and rebases them on every merge to main, and the
    # Version Packages PR is generated by changesets. Both are reviewable on
    # demand with `@coderabbitai review`.
    ignore_usernames:
      - renovate[bot]
    ignore_title_keywords:
      - Version Packages

  # Generated or derived files. CI checks each one is fresh against its source,
  # so a review comment on the output is never the fix.
  path_filters:
    - "!pnpm-lock.yaml"
    - "!**/CHANGELOG.md"
    - "!apps/docs/changelog.md"
    - "!apps/docs/public/changelog.json"
    - "!apps/docs/public/llms.txt"
    - "!apps/docs/public/llms-full.txt"
    - "!apps/docs/public/llms-meta.json"
    - "!apps/playground/public/llms.txt"
    - "!apps/playground/public/scenes/*.md"
    - "!apps/playground/public/examples/proofs/*.webp"
    - "!apps/playground/src/host/proof-manifest.json"
    - "!packages/template-tools/schema.json"
    - "!packages/template-tools/custom-block-schema.json"
    - "!skills/templatical/reference/schema.json"
    - "!skills/templatical/reference/custom-block-schema.json"
    - "!packages/ai-kit/schema/template-content.schema.json"
    - "!packages/types/tests/fixtures/operations/MANIFEST.sha256"
    - "!packages/ai-kit/eval/MANIFEST.sha256"
    - "!packages/quality/src/compatibility/data/caniemail.generated.ts"

  path_instructions:
    - path: "**"
      instructions: |
        - Generated files are never edited by hand. When their source changes, ask for the regenerate command, not an edit to the output:
          - `apps/docs/public/llms*.txt`, `apps/docs/public/llms-meta.json`: `pnpm --filter @templatical/docs run build:agent-surface`.
          - `apps/playground/public/llms.txt`, `apps/playground/public/scenes/*.md`: `pnpm --filter @templatical/playground run build:agent-surface`.
          - `apps/docs/changelog.md`, `apps/docs/public/changelog.json`: `pnpm --filter @templatical/docs run build:changelog`.
          - the schema JSON copies in `packages/template-tools/`, `skills/templatical/reference/` and `packages/ai-kit/schema/`, and the regions between `<!-- BEGIN/END GENERATED FIELDS -->` markers in `skills/templatical/reference/block-guide.md`: `pnpm --filter @templatical/template-tools run generate-schema`.
          - `packages/types/tests/fixtures/operations/MANIFEST.sha256`: `pnpm --filter @templatical/types run fixtures:manifest`.
          - `packages/ai-kit/eval/MANIFEST.sha256`: `pnpm --filter @templatical/ai-kit run eval:manifest`.
          - `packages/quality/src/compatibility/data/caniemail.generated.ts`: `pnpm --filter @templatical/quality run sync:caniemail`.
          - `apps/playground/public/examples/proofs/*.webp`, `apps/playground/src/host/proof-manifest.json`: `pnpm --filter @templatical/playground run capture:proofs`.
          - `packages/*/CHANGELOG.md`: written by changesets at release.
        - Code comments describe how the code behaves now and why. Flag a comment that narrates history ("previously", "used to", "no longer", "renamed from", "this replaced"), unless it states a constraint that stops a known bug from coming back.
        - Every package is ESM only, targeting ES2022. Flag CommonJS output, a `require` export condition, a `main` field or a UMD build.
        - Tests assert concrete values. Flag `toBeDefined()`, `toBeTruthy()`, `not.toThrow()` or a bare `typeof` check used as a test's only assertion, and a bug fix with no test that fails without it.
        - Prettier, ESLint with `--max-warnings 0`, `vue-tsc` and structural guard tests run in CI. Leave formatting and lint findings to them and comment on behaviour.

    - path: "packages/editor/src/**"
      instructions: |
        - Popups teleport into the editor's popover root (`<Teleport :to="popoverRoot">` with `usePopoverRoot()`), never `<Teleport to="body">`: the editor mounts in a shadow root by default.
        - Focus and selection go through `useEditorRoot()`, never `document.activeElement` or `window.getSelection()` directly. Two document-level uses are intentional: `composables/useFonts.ts` appends font links to `document.head`, and the editor keydown listener sits on `document`.
        - User-visible strings come from `useI18n()`, or `useCloudI18n()` for Cloud-only UI, never hardcoded. A new or changed key lands in every locale file under `src/i18n/locales/` (or `src/i18n/locales/cloud/` for Cloud strings) in the same PR. Interpolation uses `format()`, not `.replace()`.
        - On/off controls use `components/ToggleSwitch.vue`. A native `<input type="checkbox">` is not allowed.
        - Classes use the `tpl:` Tailwind prefix and `tpl-` component classes. An element carrying the bare `tpl` class must also bind `:style="themeStyles"`, or it resets the consumer's theme for its subtree.
        - A dialog panel inside `TplModal` caps its height with a percentage such as `max-h-[90%]`, never `vh`: a transformed ancestor in the host page traps `position: fixed`.
        - Panels and dialogs load with `defineAsyncComponent`. Don't statically import a lazy component, a Cloud module or an optional peer (`@templatical/renderer`, `@templatical/quality`, `pusher-js`) into the eager graph. `Editor.vue` imports `src/cloud/runtime.ts` with `import type` only.
        - `inject()` uses a `Symbol` key from `keys.ts` with an explicit `null` default and a null check, never a bare string key or an `undefined as unknown as T` cast.
        - A new `TemplaticalEditorConfig` key also goes into the config literal in `Editor.vue`, `useEditorCore`'s options, `initCloud()`'s forward in `index.ts`, and the Agent Skill under `skills/templatical/reference/`. Without the `Editor.vue` literal the option is silently inert.
        - Every `<VueDraggable>` keeps `:force-fallback="true"`, and `draggable="false"` never appears on `BlockWrapper`.

    - path: "packages/editor/package.json"
      instructions: |
        - Runtime `dependencies` stay empty: the editor bundles Vue, `@templatical/core`, `@templatical/types` and its Vue libraries. A Vue-using package belongs in `devDependencies`; listing it in `dependencies` gives consumers a second reactivity instance and a dead editor.
        - Every bare import left external in the build is declared in `peerDependencies` and `peerDependenciesMeta` as optional.

    - path: "packages/editor/vite.*config.ts"
      instructions: |
        - `external` lists only the optional peers (`@templatical/quality`, `@templatical/renderer`, `pusher-js`).
        - `manualChunks` in `vite.cdn.config.ts` groups third-party dependencies only, never first-party source: grouping first-party modules makes lazy chunks eager.
        - `@tailwindcss/vite` stays in both configs, or the published CSS loses every utility.

    - path: "packages/core/src/**"
      instructions: |
        - `vue` is aliased to `@vue/reactivity` at build time. Don't import Vue runtime APIs (components, `provide`/`inject`, lifecycle hooks) in core or `core/cloud`.
        - The dynamic `import("pusher-js")` stays wrapped in try/catch with an install hint, because `pusher-js` is an optional peer.
        - Content snapshots use `safeClone` from `@templatical/types`, never a bare `JSON.parse(JSON.stringify(...))`: Sortable can leave DOM back-references in block data.

    - path: "packages/types/**"
      instructions: |
        - `@templatical/types` has no runtime dependencies and must not gain one, including another workspace package.
        - `src/operations.ts` defines the operations contract, and `tests/fixtures/operations/**` are its test cases (one case per file, run by `tests/operations.test.ts`). The SDK owns this contract and may change cases. Templatical Cloud isn't live; its engine will be built against the fixtures as they stand, so don't ask for Cloud parity or hold a release for Cloud. Do flag a change to the check order, an error code or the accepted wire shapes that the changeset doesn't list as a breaking change, and a fixture change without a regenerated `MANIFEST.sha256`.
        - The operations engine writes by assigning and deleting keys, so a Vue proxy's traps see each change. `Object.defineProperty` is used only for a key named `__proto__`.

    - path: "packages/import-*/src/**"
      instructions: |
        - The set of importers is closed. Don't suggest a converter for another format.
        - Dividers follow one rule in every importer: a missing or `100%` width is `"full"`, another percentage stays a percentage (two decimals, clamped to 0–100), and a px width stays px until it reaches the width the line can span. A divider whose top border draws nothing (0 wide, `none`/`hidden`, or transparent) becomes a `spacer` as tall as the room it took, or is `skipped` at 0px.
        - Images use the width the source displays, never the file's natural size. A width that reaches the room is `"full"`; a percentage under 100% becomes px of the room and is `approximated`.
        - Each converted item reports an accurate status (`converted`, `approximated`, `html-fallback`, `skipped`). A lossy mapping is `approximated` with a note, never `converted`.
        - Importers never emit a `countdown` block.

    - path: "packages/renderer/src/**"
      instructions: |
        - Background colours go through `bgAttr(color, "container" | "native")` in `utils.ts`: `mj-text`, `mj-image`, `mj-table`, `mj-navbar` and `mj-video` take `container-background-color`; `mj-section` and `mj-button` take `background-color`. MJML drops a misplaced attribute without an error.
        - A new MJML attribute or head rule needs a test that compiles the output with `mjml@5` and asserts the HTML, not only the MJML string.

    - path: "apps/docs/**/*.md"
      instructions: |
        - Each page under `apps/docs/` has a German mirror at `apps/docs/de/<same path>` with the same headings, links and includes, changed in the same PR. `apps/docs/changelog.md` (generated, with a German stub) and `apps/docs/tests/` are the exceptions. German uses the formal "Sie".
        - A page's frontmatter `description` and its first sentence answer the page's question on their own: they become the `llms.txt` line and the search snippet.
        - Give exact names, types, defaults and limits, checked against the source. No derived counts ("16 platforms") and no claims nobody can verify ("works in every email client"): name the members instead.
        - Headings are noun phrases a reader would search for, never claims or slogans. No editorial adverbs (genuinely, precisely, deliberately, merely) and no "not X, but Y" constructions.
        - FSL-licensed code (editor, core, media-library) is "source-available", never "open source".
        - Code samples run as shown: real imports of real exports, no `...` placeholders. Prefer `<<<` includes of files CI runs over hand-written snippets.

    - path: "apps/playground/e2e/**"
      instructions: |
        - Never `page.waitForTimeout()`. Wait on a locator state or `expect.poll`.
        - Never `force: true`, `isVisible().catch(() => false)`, or `.first()`/`.nth()` without a semantic anchor. Prefer the `data-testid` selectors in `helpers/selectors.ts`.
        - Never read the OS clipboard (`navigator.clipboard.readText()`): parallel workers share it. Use `captureCopies` and `copiedText` from `helpers/clipboard.ts`.
        - Block drags use the page object's `dragBlockByGrip` and palette helpers. Playwright's `dragTo` cannot drive the fallback-mode Sortables.
        - A page-object method that changes state waits for the resulting state before it returns.

    - path: ".changeset/*.md"
      instructions: |
        - Bump levels are honest: `patch` for fixes, `minor` for features and for any breaking change before 1.0.
        - A breaking change starts its body with `Breaking changes:` and names the exact replacement for each removed, renamed or changed public item, so the Agent Skill's upgrade route can apply it from the changelog alone.
        - The frontmatter lists every package whose behaviour changes: the changelog attributes the entry to exactly those packages.

    - path: ".github/workflows/**"
      instructions: |
        - The Playwright image tag (`ghcr.io/templatical/playwright:v<version>-jammy`) appears in the `e2e`, `e2e-consumer` and `examples` jobs of `ci.yml` and as `TAG` in `mirror-playwright.yml`. All four match `@playwright/test` in `pnpm-lock.yaml`, and the mirror workflow runs before a new tag is used.
        - Container images come from the GHCR mirror, not `mcr.microsoft.com`, which rate-limits concurrent pulls.
        - npm auth comes from `actions/setup-node` with `registry-url` and `NODE_AUTH_TOKEN`. A committed `.npmrc` would not authenticate: pnpm refuses to expand a token in a project-level file.

    - path: "skills/templatical/**"
      instructions: |
        - Every `npx -y @templatical/template-tools@<version>` invocation carries the same pinned version, which `sync-pins` rewrites at release. Don't suggest an unpinned or different version.
        - Templates the skill produces never contain `countdown`, `custom`, `slot` or `wrapper` blocks. An email shell is `init({ layout })`, never part of the template.

    - path: "examples/**"
      instructions: |
        - `store`, `render`, `outbox` and `providers` are byte-identical across the full-stack examples (paths differ per framework). A change to one changes all of them.
        - Every `@templatical/*` range is `^<current fixed-group version>`, rewritten by `sync-pins` at release.
        - Examples install with npm and commit no lockfile.

  merge_risk_instructions: |
    High risk:
    - `packages/types/src/operations.ts` and `packages/types/tests/fixtures/operations/**`: the operations contract that collaboration, the AI kit and `template-tools edit` all apply, and that a server engine replays in order.
    - `packages/editor/package.json`, `packages/editor/vite.config.ts`, `packages/editor/vite.cdn.config.ts`, `packages/editor/api-extractor.json`: the editor bundles Vue, core and types and has no runtime dependencies. A moved dependency or external breaks consumer installs or reactivity, and the unit tests resolve one shared Vue, so they don't catch it.
    - `.github/workflows/publish.yml`, `.changeset/config.json`, `packages/template-tools/scripts/sync-pins.mjs` and the root `changeset:version` script: the release chain, which PR CI does not run.
    - `packages/types/src/url-policy.ts` and code that writes imported or user-supplied URLs into HTML.
    - `packages/core/src/collaboration.ts`, `packages/core/src/history.ts`, `packages/core/src/auto-save.ts`: ordering and dirty-state logic where races are easy to introduce.
    - `packages/editor/src/index.ts` and the shadow-DOM mount: every consumer's entry point.
    Low risk: changes limited to docs prose, `apps/playground/**`, test files, or example READMEs.

  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: warning
      requirements: |
        The squash commit on main takes the PR title, so it follows Conventional Commits: `type(scope): summary` or `type: summary`.
        - `type` is one of feat, fix, perf, refactor, docs, test, chore, ci, build, revert, skill.
        - `scope` is optional and names one or more packages or areas, comma-separated, for example `fix(import-unlayer, import-html): …` or `chore(deps): …`.
        - A `!` after the type or scope marks a breaking change.
    custom_checks:
      - name: German docs mirror
        mode: warning
        instructions: |
          Consider every file the PR adds, modifies, deletes or renames that matches `apps/docs/**/*.md`, excluding `apps/docs/de/**`, `apps/docs/public/**`, `apps/docs/tests/**` and `apps/docs/changelog.md`. For each such English page `apps/docs/<path>`, the German page is `apps/docs/de/<path>`.
          Pass when, for every such English page, the PR makes the same kind of change to the German page: adds it when the English page is added, deletes it when deleted, renames it when renamed, modifies it when modified.
          Also pass a modified English page whose German page is unchanged when the PR description says why the German page needs no change (for example, an English-only typo fix).
          Otherwise fail, and list each English page whose German page is missing from the PR.
      - name: Changeset for published packages
        mode: warning
        instructions: |
          Every package under `packages/` is published to npm.
          Collect the packages that have at least one changed file under `packages/<name>/src/**`, ignoring files under `__tests__/` directories. Changes only to tests, scripts or docs need no changeset.
          Pass when no such package exists, when the PR title starts with `Version Packages`, or when the PR description says why the change ships without a release note.
          Otherwise pass only when, for each collected package, an added or modified `.changeset/*.md` file names that package (`"@templatical/<name>": patch|minor|major`) in its frontmatter.
          When failing, list the packages with no changeset entry.
      - name: Breaking changes name their replacement
        mode: warning
        instructions: |
          Apply this to each `.changeset/*.md` file the PR adds or modifies.
          A change is breaking when the entry describes removing or renaming a public export, type, config option, CLI command or flag, event, CSS custom property or class, or changing a public default or documented behaviour that existing callers rely on.
          For every breaking change, all three must hold:
          1. The entry body contains a line `Breaking changes:` followed by one bullet per breaking change.
          2. Each bullet names the exact replacement (the new export, option, value or command), or says there is none and what callers do instead.
          3. The frontmatter bumps the affected packages at `minor` or `major`, never `patch`. Before 1.0, `minor` is the breaking channel.
          Pass when no changeset describes a breaking change, or when every breaking change meets all three rules. Otherwise fail and quote the entry.

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    autofix:
      enabled: false

  tools:
    # The repository lints with ESLint and Prettier. These tools' default rules
    # would contradict that setup, and docs prose is checked by docs tests.
    biome:
      enabled: false
    oxc:
      enabled: false
    markdownlint:
      enabled: false
    languagetool:
      enabled: false

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - CONTRIBUTING.md
