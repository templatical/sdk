<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Teal mug</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #f1e3cb; }
main { position: relative; width: 720px; height: 400px; overflow: hidden; }
.shadow { position: absolute; left: 235px; top: 306px; width: 250px; height: 22px; background: #d0c0a6; border-radius: 50%; }
.handle { position: absolute; left: 405px; top: 123px; width: 100px; height: 116px; border: 24px solid #4d8792; border-radius: 50%; }
.mug { position: absolute; left: 240px; top: 100px; width: 200px; height: 210px; background: #4d8792; border-top: 16px solid #306773; border-radius: 14px 14px 64px 64px; }
</style>
<main aria-label="A teal mug on a plain cream background">
  <div class="shadow"></div><div class="handle"></div><div class="mug"></div>
</main>
</html>
