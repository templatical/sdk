<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Decorative divider</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #edf0eb; font-family: Arial, Helvetica, sans-serif; color: #193c35; }
main { width: 640px; margin: 24px auto; padding: 36px; background: #fffdf7; }
h1 { margin: 12px 0 20px; font-size: 38px; }
h2 { font-size: 23px; }
p { font-size: 20px; line-height: 1.5; }
.label { text-transform: uppercase; letter-spacing: 3px; font-size: 14px; }
.button { display: inline-block; padding: 16px 24px; margin: 16px 0; background: #21675b; color: white; text-decoration: none; font-size: 20px; font-weight: bold; border-radius: 6px; }
.columns { display: flex; gap: 24px; } .columns article { width: 50%; }
.drawing { height: 140px; background: #e9d8b6; border-radius: 8px; display: grid; place-items: center; font-size: 50px; }
main { padding: 40px; } .divider { display:flex; align-items:center; gap:20px; height:60px; } .divider span { flex:1; height:2px; background:#729487; } .divider b { font-size:32px; color:#729487; }
</style>
<main><div class="divider"><span></span><b>✦</b><span></span></div></main></html>
