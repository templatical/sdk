name: Publish

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Use a PAT (CHANGESETS_PAT) so the Version Packages PR is pushed under
      # a real user identity instead of GITHUB_TOKEN. GitHub's anti-recursion
      # guard suppresses workflow runs triggered by GITHUB_TOKEN — without a
      # PAT, the CI workflow never fires on the VP PR and required-check
      # rules hold it in "Expected — Waiting for status" forever. With the
      # PAT, ci.yml fires normally; jobs detect the `changeset-release/*`
      # branch via their IS_VP env flag and no-op their work while still
      # reporting green.
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.CHANGESETS_PAT }}
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      # `registry-url` is what authenticates the npm publish: it writes an
      # .npmrc reading `NODE_AUTH_TOKEN` and points NPM_CONFIG_USERCONFIG at
      # it, which pnpm honors. changesets/action v2 removed its own .npmrc
      # handling, so without this the publish step fails with ENEEDAUTH.
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v2.1.1
        with:
          # The PAT reaches the action through this input only. v2 refuses to read
          # a custom token from the GITHUB_TOKEN environment variable, and throws
          # outright if that variable is set to something other than this input.
          github-token: ${{ secrets.CHANGESETS_PAT }}
          # Custom version command: `changeset version` (bumps package.jsons +
          # changelogs) then sync the templatical-email skill, so the Version
          # Packages PR carries everything and no manual bump is needed:
          #   1. live-mode CDN pin (EDITOR_VERSION) -> new @templatical/editor
          #   2. re-bundle vendor/*.mjs -> new @templatical/quality lint rules
          #      (needs the `pnpm run build` above: quality is bundled from dist)
          #   3. patch-bump .claude-plugin/plugin.json if either moved, since
          #      Claude Code caches the plugin by that version
          version-script: pnpm run changeset:version
          publish-script: pnpm exec changeset publish
          # One aggregated release is created below instead. The nine packages are a
          # changesets `fixed` group, so the default produced nine near-identical
          # releases per version and whichever published last became "Latest" on the
          # repo home page (it was `import-beefree`).
          create-github-releases: false
          # v2 decoupled tag pushing from release creation, defaulting it on. Under
          # v1, `create-github-releases: false` suppressed both, which is why the
          # per-package tags stop at 0.20.0 — the aggregated `v<version>` tag below
          # is the only one we want. Leaving this at its default would resume
          # pushing nine tags per release.
          push-git-tags: false
          # Keep pushing release commits with the Git CLI, as v1 did. v2's new
          # GitHub-API default would change how the Version Packages branch is
          # written, and the VP PR must reliably trigger ci.yml (see the checkout
          # comment above) — not something to change in the same step as everything
          # else.
          push-with-git-cli: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Single `v<version>` release whose body is the aggregated changelog for that
      # version — the same generator that writes the docs page, so the two can't
      # diverge. Gives the repo sidebar, the releases.atom feed and watch-for-releases
      # notifications one meaningful entry per release.
      - name: Create aggregated GitHub release
        if: steps.changesets.outputs.published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_PAT }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
        run: |
          set -euo pipefail
          # Every package in the fixed group publishes at the same version, so the
          # first entry's version is the release version.
          VERSION="$(printf '%s' "$PUBLISHED_PACKAGES" | jq -r '.[0].version // empty')"
          if [ -z "$VERSION" ]; then
            echo "Could not determine the published version — skipping release creation."
            exit 0
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists — nothing to do."
            exit 0
          fi
          # npm publish already succeeded by this point, so a notes-generation problem
          # must not fail the run — fall back to a minimal body and surface the reason
          # in the log instead of leaving the release missing and the workflow red.
          if ! node apps/docs/scripts/build-changelog.mjs --release-notes "$VERSION" > release-notes.md; then
            echo "::warning::Could not generate aggregated notes for $VERSION — using a minimal release body."
            printf 'Full changelog: https://docs.templatical.com/changelog\n' > release-notes.md
          fi
          # Attach the npm tarballs so the packages can be installed without the
          # registry. `pnpm pack` writes the same file changeset publish just
          # sent to npm: built, and with every `workspace:*` replaced by a real
          # version. A source archive of this repo has neither.
          mkdir -p release-assets
          while read -r NAME; do
            if ! pnpm --filter "$NAME" pack --pack-destination release-assets; then
              echo "::warning::Could not pack $NAME — the release will not carry its tarball."
            fi
          done < <(printf '%s' "$PUBLISHED_PACKAGES" | jq -r '.[].name')
          # nullglob is what makes the count below correct: without it an empty
          # match leaves the literal glob in the array.
          shopt -s nullglob
          ASSETS=(release-assets/*.tgz)

          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA"
          # Upload separately, never as `gh release create` asset arguments. An
          # inline upload failure fails this step after npm publish has already
          # succeeded, which skips the marketing-site rebuild below and leaves
          # the `gh release view` guard above to short-circuit the re-run — so
          # the assets never land and the run stays red. Same reasoning as the
          # notes fallback: the packages are on npm either way, so a release
          # missing an asset beats no release at all.
          if [ "${#ASSETS[@]}" -gt 0 ]; then
            echo "Attaching ${#ASSETS[@]} tarball(s) to v$VERSION."
            if ! gh release upload "v$VERSION" "${ASSETS[@]}"; then
              echo "::warning::Could not attach the tarballs to v$VERSION."
            fi
          else
            echo "::warning::No tarballs were packed — v$VERSION will carry none."
          fi
          rm -rf release-notes.md release-assets

      - name: Trigger marketing-site rebuild
        if: steps.changesets.outputs.published == 'true'
        env:
          DEPLOY_HOOK: ${{ secrets.TEMPLATICAL_COM_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "TEMPLATICAL_COM_DEPLOY_HOOK secret not set — skipping rebuild trigger."
            exit 0
          fi
          curl -fsSL -X POST "$DEPLOY_HOOK" -o /dev/null -w "HTTP %{http_code}\n"
