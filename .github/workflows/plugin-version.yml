name: Plugin version

# No `paths:` filter, deliberately. This job is a REQUIRED check, and a
# workflow that never starts reports no status — branch protection then parks
# the PR on "Expected" forever (same reason ci.yml gates inside its jobs
# instead of with a job-level `if:`). So it runs on every PR and decides
# internally whether there is anything to check.
on:
  pull_request:
    branches: [main]

concurrency:
  group: plugin-version-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only: the job diffs two commits and exits. It never pushes, comments,
# or bumps the version itself — the bump is the author's decision.
permissions:
  contents: read

jobs:
  version-bumped:
    runs-on: ubuntu-latest
    # Two plugins live in this one marketplace (skills/templatical-email and
    # skills/templatical-sdk), each with its own version stream, and each is
    # diffed and judged independently below: a change under one plugin must
    # never demand a bump from the other.
    #
    # They are checked by ONE job looping over both, deliberately not by a
    # `strategy.matrix`. This job's name is a required status check pinned by
    # the ruleset on `main` as the literal string `version-bumped`, and a
    # matrix reports one context per leg — `version-bumped (templatical-email)`
    # and `version-bumped (templatical-sdk)` — so the pinned string would
    # never be reported again and every PR would block on a check that no
    # longer exists. GitHub's required-status-checks model has no wildcard, so
    # a matrix here costs a branch-protection edit and risks blocking the
    # repo; the parallelism it would buy is two `git diff` calls.
    env:
      # Version Packages PRs are generated from changesets and never touch
      # either skill's package.json (changesets skips private packages), but
      # skip them the way ci.yml does so a stray one can't block the release
      # train.
      IS_VP: ${{ startsWith(github.head_ref, 'changeset-release/') }}
    steps:
      - name: Skip on Version Packages PR
        if: env.IS_VP == 'true'
        run: echo "Skipped — Version Packages PR."

      - if: env.IS_VP != 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Claude Code resolves a plugin's version from its plugin.json first,
      # and caches the plugin under that version. Shipping a change without
      # bumping it means existing installs keep the stale copy indefinitely,
      # while fresh installs get the new code under the SAME version string —
      # two users on "0.2.0" running different code. Nothing else in the repo
      # bumps either of these: both skills' package.json are private, so
      # changesets leaves them alone.
      - name: Require a plugin.json version bump
        if: env.IS_VP != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # Every plugin in this marketplace, judged independently. Failures
          # accumulate rather than exiting early, so one plugin's missing bump
          # cannot hide the other's — the `fail-fast: false` a matrix would
          # have given, without the matrix's cost to the required-check name.
          failed=0

          for skill in templatical-email templatical-sdk; do
          SKILL="skills/$skill"
          MANIFEST="$SKILL/.claude-plugin/plugin.json"

          # The path gate lives here rather than in `on:` so the check always
          # reports a status. Most PRs land in this branch and pass instantly.
          #
          # Only files an INSTALLED user gets the behavior of count. The
          # excluded paths ship in the plugin cache but are never invoked
          # from SKILL.md: tools/ is maintainer tooling whose OUTPUT lands
          # under reference/ — deliberately absent from the exclude list
          # below, because a regenerated reference tree shipping under an
          # unchanged version is exactly the two-users-one-version hazard
          # this check exists to prevent. For templatical-email that output
          # is reference/schema.json, generated by
          # packages/template-tools's schema generator; for templatical-sdk
          # it is the reference/ doc tree, generated by this skill's own
          # tools/generate-reference.mjs. tests/ and evals/ are CI-only, and
          # package.json declares no runtime dependencies for either skill,
          # so it is maintainer metadata: a devDependency bump cannot change
          # what an installed skill does, and must not force every user to
          # re-download.
          # This is a denylist on purpose: any new path defaults to requiring
          # a bump, so forgetting to update this list fails safe.
          changed="$(git diff --name-only "$BASE_SHA" HEAD -- \
            "$SKILL/" \
            ":(exclude)$SKILL/tools/**" \
            ":(exclude)$SKILL/tests/**" \
            ":(exclude)$SKILL/evals/**" \
            ":(exclude)$SKILL/vitest.config.ts" \
            ":(exclude)$SKILL/package.json")"

          if [ -z "$changed" ]; then
            echo "No user-facing changes under $SKILL/ — no bump required."
            continue
          fi

          head_version="$(jq -r '.version // empty' "$MANIFEST")"
          if [ -z "$head_version" ]; then
            echo "::error file=$MANIFEST::No \`version\` field. Either restore it, or drop it deliberately to switch this plugin to commit-SHA versioning (and delete this workflow)."
            failed=1
            continue
          fi

          # Absent on the base ref = this plugin is new in this PR; nothing to bump against.
          if ! git cat-file -e "$BASE_SHA:$MANIFEST" 2>/dev/null; then
            echo "New plugin manifest in this PR (version $head_version) — no bump required."
            continue
          fi

          base_version="$(git show "$BASE_SHA:$MANIFEST" | jq -r '.version // empty')"

          # Must INCREASE, not merely differ — a downgrade would re-issue a
          # version some installs already cached, so they'd never see the change.
          if [ "$head_version" != "$base_version" ] &&
             [ "$(printf '%s\n%s\n' "$base_version" "$head_version" | sort -V | tail -1)" != "$head_version" ]; then
            echo "::error file=$MANIFEST::Version went backwards: $base_version -> $head_version. Installs that already cached $head_version would never pick this up."
            failed=1
            continue
          fi

          if [ "$head_version" = "$base_version" ]; then
            echo "::error file=$MANIFEST::This PR changes user-facing files under $SKILL/ but leaves version at $head_version. Bump it so installed plugins actually update (see docs: version resolution). Tests, evals and dev tooling are exempt — these files are not:"
            printf '%s\n' "$changed" | sed 's/^/  /'
            failed=1
            continue
          fi

          echo "$skill: version bumped $base_version -> $head_version"
          done

          exit "$failed"
